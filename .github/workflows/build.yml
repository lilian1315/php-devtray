name: Build Microsoft Store package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build, check and publish
        run: ./scripts/build.ps1 -Publish
      - name: Build MSIX with a development identity
        run: ./scripts/build-store-package.ps1 -DevelopmentIdentity
      - name: Upload development package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: development-msix
          path: |
            artifacts/store/*.msix
            artifacts/store/*.msix.sha256
            artifacts/store/*.msix.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
