name: Release to Microsoft Store

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example v0.8.0-preview)
        required: true
        type: string
      publish:
        description: Submit to Store (requires first publication and configured credentials)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: store-${{ github.repository }}
  cancel-in-progress: false

jobs:
  package:
    # Credentials stay on this disposable GitHub-hosted VM, which is destroyed after the job.
    runs-on: windows-2025
    environment: store
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $props = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup
          $releaseVersion = ([string]$props.InformationalVersion).Split('+')[0]
          if (-not $releaseVersion) { $releaseVersion = [string]$props.Version }
          if ($env:RELEASE_TAG -cne "v$releaseVersion") {
            throw 'The tag must match InformationalVersion (or Version when unset) in Directory.Build.props.'
          }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build, check and publish
        run: ./scripts/build.ps1 -Publish
      - name: Build unsigned Store submission package
        env:
          STORE_PACKAGE_NAME: ${{ vars.STORE_PACKAGE_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          ./scripts/build-store-package.ps1 -PackageName $env:STORE_PACKAGE_NAME `
            -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME
      - name: Upload package for Partner Center
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: microsoft-store-submission
          path: |
            artifacts/store/*.msix
            artifacts/store/*.msix.sha256
            artifacts/store/*.msix.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Check automatic submission configuration
        id: store_config
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          STORE_AUTOPUBLISH: ${{ vars.STORE_AUTOPUBLISH }}
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          $requested = if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $env:MANUAL_PUBLISH -eq 'true'
          } else {
            $env:STORE_AUTOPUBLISH -eq 'true'
          }
          if (-not $requested) {
            'enabled=false' >> $env:GITHUB_OUTPUT
            '### Store package ready' >> $env:GITHUB_STEP_SUMMARY
            'Automatic submission is disabled. Download the microsoft-store-submission artifact for manual upload. After the first Store publication, configure the store environment as described in docs/RELEASING.md.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          foreach ($name in @('STORE_PRODUCT_ID', 'PARTNER_CENTER_TENANT_ID', 'PARTNER_CENTER_SELLER_ID', 'PARTNER_CENTER_CLIENT_ID', 'PARTNER_CENTER_CLIENT_SECRET')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Automatic submission was requested but $name is missing from the store environment. See docs/RELEASING.md."
            }
          }
          $sellerId = 0
          if (-not [int]::TryParse($env:PARTNER_CENTER_SELLER_ID.Trim(), [Globalization.NumberStyles]::None, [Globalization.CultureInfo]::InvariantCulture, [ref]$sellerId) -or $sellerId -le 0) {
            throw 'PARTNER_CENTER_SELLER_ID must be the numeric Seller ID from Partner Center > Account settings > Organization profile > Legal info (or Identifiers). Use digits only, within 1..2147483647. This is not the publisher GUID/CN, Store product ID, tenant ID, or client ID. Update the secret in the GitHub store environment; do not paste it into logs.'
          }
          'enabled=true' >> $env:GITHUB_OUTPUT
      - name: Install Microsoft Store Developer CLI
        if: steps.store_config.outputs.enabled == 'true'
        id: store_cli
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.4
      - name: Submit package to Microsoft Store
        if: steps.store_config.outputs.enabled == 'true'
        env:
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          STORE_FLIGHT_ID: ${{ vars.STORE_FLIGHT_ID }}
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts/store -Filter '*.msix' -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one Store MSIX package.' }
          & msstore reconfigure --tenantId $env:PARTNER_CENTER_TENANT_ID --sellerId $env:PARTNER_CENTER_SELLER_ID.Trim() --clientId $env:PARTNER_CENTER_CLIENT_ID --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store authentication configuration failed.' }
          $productId = $env:STORE_PRODUCT_ID.Trim()
          & msstore apps get $productId > $null
          if ($LASTEXITCODE -ne 0) {
            Write-Output 'Application lookup failed. Listing applications accessible to this Entra application (read-only):'
            & msstore apps list
            throw 'Store application lookup failed before any package upload. Verify STORE_PRODUCT_ID against the Partner Center product identity. If the app is missing from the list, check that the configured tenant/client application is added in Partner Center User management > Microsoft Entra applications with the Manager role and access to this product. Saving CLI credentials does not verify API access. See docs/RELEASING.md.'
          }
          $arguments = @('publish', $packages[0].FullName, '--appId', $productId)
          if (-not [string]::IsNullOrWhiteSpace($env:STORE_FLIGHT_ID)) { $arguments += @('--flightId', $env:STORE_FLIGHT_ID) }
          & msstore @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store submission failed. Check the CLI output and Partner Center.' }
          '### Package submitted to Microsoft Store' >> $env:GITHUB_STEP_SUMMARY
          'The package was submitted using the configured Store audience or flight. Certification and publication status remain available in Partner Center.' >> $env:GITHUB_STEP_SUMMARY
