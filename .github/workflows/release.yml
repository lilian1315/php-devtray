name: Prepare Microsoft Store submission

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example v0.7.0-preview)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: store-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025
    environment: store
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $props = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup
          $releaseVersion = ([string]$props.InformationalVersion).Split('+')[0]
          if (-not $releaseVersion) { $releaseVersion = [string]$props.Version }
          if ($env:RELEASE_TAG -cne "v$releaseVersion") {
            throw 'The tag must match InformationalVersion (or Version when unset) in Directory.Build.props.'
          }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build, check and publish
        run: ./scripts/build.ps1 -Publish
      - name: Build unsigned Store submission package
        env:
          STORE_PACKAGE_NAME: ${{ vars.STORE_PACKAGE_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          ./scripts/build-store-package.ps1 -PackageName $env:STORE_PACKAGE_NAME `
            -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME
      - name: Upload package for Partner Center
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: microsoft-store-submission
          path: |
            artifacts/store/*.msix
            artifacts/store/*.msix.sha256
            artifacts/store/*.msix.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
