name: Submit release to WinGet

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub release tag (for example v0.7.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: winget-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  submit:
    runs-on: windows-2025
    environment: release
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Download public stable release and create manifests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          WINGET_PACKAGE_IDENTIFIER: ${{ vars.WINGET_PACKAGE_IDENTIFIER }}
          WINGET_LICENSE: ${{ vars.WINGET_LICENSE }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          foreach ($name in @('WINGET_PACKAGE_IDENTIFIER', 'WINGET_LICENSE', 'WINGET_CREATE_GITHUB_TOKEN')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Configure $name in the release environment. See docs/RELEASING.md."
            }
          }
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'WinGet requires a stable tag matching Version.' }
          $repositoryJson = & gh repo view --json visibility
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read repository visibility.' }
          if (($repositoryJson | ConvertFrom-Json).visibility -ne 'PUBLIC') { throw 'WinGet requires publicly downloadable releases.' }
          $json = & gh release view $env:RELEASE_TAG --json isDraft,isPrerelease,url
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the GitHub release.' }
          $release = $json | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) { throw 'WinGet requires a public stable release.' }
          $name = "PhpDevTray-$version-Setup-x64.exe"
          & gh release download $env:RELEASE_TAG --pattern $name --dir artifacts/winget-download
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download the public signed installer.' }
          ./scripts/new-winget-manifest.ps1 -InstallerPath "artifacts/winget-download/$name" `
            -PackageIdentifier $env:WINGET_PACKAGE_IDENTIFIER -License $env:WINGET_LICENSE `
            -Repository $env:GH_REPO -Tag $env:RELEASE_TAG
      - name: Preserve generated manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: winget-manifests
          path: artifacts/winget/*
          if-no-files-found: error
      - name: Download and verify Microsoft WinGet Create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = & gh api repos/microsoft/winget-create/releases/tags/v1.12.13.0
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the pinned WinGet Create release.' }
          $asset = ($json | ConvertFrom-Json).assets | Where-Object name -eq 'wingetcreate.exe'
          if (@($asset).Count -ne 1 -or $asset.digest -notmatch '^sha256:[0-9a-fA-F]{64}$') {
            throw 'The pinned release must provide one wingetcreate.exe asset with a SHA-256 digest.'
          }
          $tool = Join-Path $env:RUNNER_TEMP wingetcreate.exe
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $tool
          $hash = (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash
          if ($hash -ine $asset.digest.Substring(7)) { throw 'WinGet Create checksum mismatch.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $tool
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation(,|$)') {
            throw 'WinGet Create must have a valid Microsoft signature.'
          }
      - name: Validate and submit WinGet pull request
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          # WinGet Create validates YAML with its bundled WinGetUtil before opening the PR.
          # GitHub's Windows runners do not guarantee an installed winget CLI.
          & "$env:RUNNER_TEMP/wingetcreate.exe" submit --no-open artifacts/winget
          if ($LASTEXITCODE -ne 0) { throw 'WinGet submission failed. Inspect existing PRs before retrying.' }
